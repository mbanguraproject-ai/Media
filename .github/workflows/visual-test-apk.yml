name: Visual test APK

on:
  push:
    branches: ["feature/via-immersive-experience"]
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/visual-test-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Set up the upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for s in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!s}" ]; then
              echo "::error::Secret $s is missing."
              exit 1
            fi
          done
          ks="$RUNNER_TEMP/upload-keystore.jks"
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$ks"
          keytool -list -keystore "$ks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          {
            echo "storeFile=$ks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build minified release APKs
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Verify signed ARM64 APK
        run: |
          apk=$(find app/build/outputs/apk/release -type f -name '*arm64-v8a*.apk' -print -quit)
          test -n "$apk"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          "$build_tools/apksigner" verify --verbose --print-certs "$apk"

      - name: Upload ARM64 visual-test APK
        uses: actions/upload-artifact@v4
        with:
          name: via-immersive-visual-test-arm64-v39
          path: app/build/outputs/apk/release/*arm64-v8a*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Remove the key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks" keystore.properties
