# Compiles the release the way Play gets it (R8, minified) and checks the DEX
# it produces. Debug builds skip R8, so a fault that only R8 introduces - like
# the register-allocation one that crashed 4.5 at launch - is invisible until
# this runs. See tools/dex_registers.py.
name: Release check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  r8-dex:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Only the R8 step: packaging needs the release keystore, which never
      # leaves the owner's machine, and the DEX is complete before packaging.
      - name: Compile release with R8
        run: ./gradlew --no-daemon --stacktrace :app:minifyReleaseWithR8

      - name: Check method register counts
        run: python3 tools/dex_registers.py app/build/intermediates/dex/release --package com.media.app --top 20
