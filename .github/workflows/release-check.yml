# Compiles the app both ways it gets built - release (R8, minified) and debug
# (D8, unminified, every local kept alive for the debugger) - and checks the
# DEX each produces. A method needing more than 255 registers is where 4.5's
# launch VerifyError came from. See tools/dex_registers.py.
#
# Run it by hand on any commit (Actions > Release check > Run workflow) to
# check an older build: the tool always comes from this branch.
#
# A third job checks every translation against the English strings
# (tools/check_translations.py) in seconds, before the builds get far.
name: Release check

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit, branch or tag to build (default: this one)"
        required: false
      decode:
        description: "Obfuscated class names from a Play crash report to decode, space separated (e.g. com.media.app.o6)"
        required: false

jobs:
  strings:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: translations
    steps:
      - uses: actions/checkout@v4
      - name: Check every translation against English
        run: python3 tools/check_translations.py

  dex:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # Only the R8 step for release: packaging needs the release
          # keystore, which never leaves the owner's machine, and the DEX is
          # complete before packaging.
          - build: release
            task: ":app:minifyReleaseWithR8"
            dex: "src/app/build/intermediates/dex/release"
          - build: debug
            task: ":app:assembleDebug"
            dex: "src/app/build/outputs/apk/debug/*arm64-v8a*.apk"
    name: ${{ matrix.build }}
    steps:
      - name: Check out the tool
        uses: actions/checkout@v4
        with:
          path: tool

      - name: Check out the code to build
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          path: src

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile (${{ matrix.build }})
        working-directory: src
        run: |
          git log -1 --format='Building %h %s'
          ./gradlew --no-daemon --stacktrace ${{ matrix.task }}

      - name: Check method register counts
        run: python3 tool/tools/dex_registers.py ${{ matrix.dex }} --package com.media.app --top 20

      # A crash report's obfuscated names, decoded right here in the log:
      # each class's real name and what its members were called.
      - name: Decode crash names
        if: matrix.build == 'release' && inputs.decode != ''
        env:
          NAMES: ${{ inputs.decode }}
        run: |
          for n in $NAMES; do
            echo "=== $n"
            grep -n -A12 -- "-> ${n}:\$" src/app/build/outputs/mapping/release/mapping.txt || echo "(not in this build's mapping)"
          done

      # R8's map from obfuscated names (com.media.app.o6) back to the real
      # ones. Play Console crash reports name the obfuscated classes; this
      # turns them back into a file and a function. Kept 90 days per run.
      - name: Keep the R8 mapping
        if: matrix.build == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping
          path: src/app/build/outputs/mapping/release/mapping.txt
          retention-days: 90
