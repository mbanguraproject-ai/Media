# Builds the Play bundle (AAB), signed with the upload key, ready to upload in
# Play Console. Play App Signing then re-signs it with the app signing key.
#
# Run it from Actions > Release > Run workflow, or push a tag such as v6.0.3.
# The signed ABI APKs, signed .aab and R8 mapping are kept on the run page for 90 days.
#
# The upload key comes from four repository secrets (Settings > Secrets and
# variables > Actions):
#   KEYSTORE_BASE64    the keystore file, base64 encoded
#   KEYSTORE_PASSWORD  its password
#   KEY_ALIAS          the key's alias in it
#   KEY_PASSWORD       the key's password
# They are written into keystore.properties on the runner - the same file a
# local build reads - so app/build.gradle.kts needs nothing extra. The
# keystore and keystore.properties are never committed.
name: Release

on:
  workflow_dispatch:
  push:
    branches: ["feature/via-free-no-ads"]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Set up the upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for s in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!s}" ]; then
              echo "::error::Secret $s is missing. Add it in Settings > Secrets and variables > Actions."
              exit 1
            fi
          done
          ks="$RUNNER_TEMP/upload-keystore.jks"
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$ks"
          # A wrong password or alias fails here, with a clear message,
          # rather than deep inside the Gradle build.
          keytool -list -keystore "$ks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null || {
            echo "::error::The keystore did not open with KEYSTORE_PASSWORD and KEY_ALIAS. Check those secrets for typos or extra spaces."
            exit 1
          }
          {
            echo "storeFile=$ks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Confirm monetisation SDKs are absent
        run: |
          ./gradlew --no-daemon :app:dependencies --configuration releaseRuntimeClasspath > "$RUNNER_TEMP/release-dependencies.txt"
          if grep -Eiq 'play-services-ads|user-messaging-platform|com\.android\.billingclient|billingclient' "$RUNNER_TEMP/release-dependencies.txt"; then
            echo "::error::An advertising, consent or Play Billing dependency is present in the release runtime graph."
            grep -Ein 'play-services-ads|user-messaging-platform|com\.android\.billingclient|billingclient' "$RUNNER_TEMP/release-dependencies.txt"
            exit 1
          fi
          echo "No AdMob, UMP or Play Billing artifacts in releaseRuntimeClasspath."

      - name: Build the signed APKs and bundle
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease :app:bundleRelease

      # Play rejects a bundle whose certificate is not the registered upload
      # key: compare this SHA-256 with Play Console > App signing > Upload key.
      # Fails if the bundle came out unsigned.
      - name: Verify and show the bundle signing certificate
        run: |
          jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab
          keytool -printcert -jarfile app/build/outputs/bundle/release/app-release.aab | grep -E "Owner:|SHA256:"

      - name: Verify every signed APK
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          if [ "${#apks[@]}" -ne 2 ]; then
            echo "::error::Expected exactly two ABI APKs (arm64-v8a and armeabi-v7a), found ${#apks[@]}."
            printf '%s\\n' "${apks[@]}"
            exit 1
          fi
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          for apk in "${apks[@]}"; do
            echo "=== Verifying $apk"
            "$build_tools/apksigner" verify --verbose --print-certs "$apk"
          done

      - name: Check method register counts
        run: python3 tools/dex_registers.py app/build/outputs/bundle/release/app-release.aab --package com.media.app --top 20

      - name: Name the download after the version
        id: version
        run: |
          name=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          code=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts)
          echo "Version $name (code $code)"
          echo "artifact=via-$name-code$code" >> "$GITHUB_OUTPUT"

      - name: Keep signed APKs, bundle and R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
          retention-days: 90
          if-no-files-found: error

      - name: Remove the key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks" keystore.properties
